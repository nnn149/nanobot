name: Publish ARM64 image

on:
  push:
    branches:
      - arm64
    paths:
      - Dockerfile
      - docker-compose.yml
      - entrypoint.sh
      - pyproject.toml
      - uv.lock
      - hatch_build.py
      - render-config.json
      - nanobot/**
      - scripts/**
      - webui/**
      - .github/workflows/publish-arm64.yml
  workflow_dispatch:

concurrency:
  group: publish-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=arm64
            type=sha,prefix=arm64-

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UV_VERSION=0.12.7
            PLAYWRIGHT_VERSION=1.55.0
            SUMMARIZE_VERSION=0.21.8
            NANOBOT_CHANNELS=discord,email,feishu,napcat,qq,telegram,websocket,wecom,weixin
          cache-from: type=gha,scope=nanobot-arm64
          cache-to: type=gha,mode=max,scope=nanobot-arm64
