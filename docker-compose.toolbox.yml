# Image-only deployment for the toolbox-arm64 branch.
# It deliberately does not use "build:", so a target host only pulls GHCR images.
name: nanobot-toolbox

x-common-config: &common-config
  image: ${NANOBOT_IMAGE:-ghcr.io/nnn149/nanobot:toolbox-arm64}
  environment:
    NANOBOT_RUN_AS_ROOT: ${NANOBOT_RUN_AS_ROOT:-1}
  volumes:
    - ${NANOBOT_DATA_DIR:-./data}:/home/nanobot/.nanobot
  init: true
  # Chromium and LibreOffice benefit from a larger shared-memory mount.
  shm_size: ${NANOBOT_SHM_SIZE:-1gb}
  # The toolbox intentionally runs as root by default. Do not add a Docker
  # socket, privileged mode, or broad host mounts to this file.
  deploy:
    resources:
      limits:
        cpus: "${NANOBOT_CPU_LIMIT:-2}"
        memory: ${NANOBOT_MEMORY_LIMIT:-3G}

services:
  nanobot-gateway:
    container_name: nanobot-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    # Gateway and API are intentionally exposed to the LAN. Restrict them with
    # a firewall or reverse proxy before exposing the host to untrusted networks.
    ports:
      - "0.0.0.0:${NANOBOT_GATEWAY_PORT:-18790}:18790"
      - "${NANOBOT_WEBUI_PORT:-8765}:8765"

  nanobot-api:
    container_name: nanobot-api
    <<: *common-config
    command: ["serve", "--host", "0.0.0.0", "-w", "/home/nanobot/.nanobot/api-workspace"]
    restart: unless-stopped
    profiles: ["api"]
    ports:
      - "0.0.0.0:${NANOBOT_API_PORT:-8900}:8900"

  nanobot-cli:
    container_name: nanobot-cli
    <<: *common-config
    profiles: ["cli"]
    command: ["status"]
    stdin_open: true
    tty: true
